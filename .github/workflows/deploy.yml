name: Deploy to Cloudflare Workers

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # 3.41.2 (Dart 3.11.0) is missing ReorderableListView.builder's
          # onReorderItem parameter used in channels_screen.dart and
          # path_editor_sheet.dart; 3.47.2 has it and builds clean locally.
          flutter-version: '3.47.2'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Get dependencies
        run: flutter pub get

      - name: Build Web
        run: bun run build

      - name: Verify web build succeeded
        run: |
          if [ ! -f build/web/main.dart.js ]; then
            echo "::error::flutter build web did not produce build/web/main.dart.js — build_pipe swallows the underlying flutter failure, so check .flutter_build_pipe/logs/ below for the real error."
            find .flutter_build_pipe/logs -name "*.log" -exec echo "--- {} ---" \; -exec cat {} \;
            exit 1
          fi

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
